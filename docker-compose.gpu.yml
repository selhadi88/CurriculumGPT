# GPU override — enables NVIDIA GPU for the backend (and the trainer service).
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
#
# Requires the NVIDIA Container Toolkit on the host
# (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/).
services:
  backend:
    environment:
      DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot trainer: builds the dataset (if missing), trains CurriculumGPT on
  # the GPU, runs the full evaluation pipeline, and writes outputs/runs/<id>/.
  trainer:
    build:
      context: .
      dockerfile: backend/Dockerfile.gpu   # CUDA base image for GPU training
    profiles: ["train"]   # only runs when explicitly requested
    environment:
      DEVICE: cuda
      MODEL_CACHE_DIR: /model_cache
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - model_cache:/model_cache
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
    command: ["python", "scripts/run_full_pipeline.py", "--epochs", "30"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
