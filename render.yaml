# Render Blueprint — frontend only.
#
# CurriculumGPT is split across two hosts:
#   • Backend  → Hugging Face Space (Docker, free 16 GB) — see .hf/ and
#     .github/workflows/deploy-hf-space.yml
#   • Frontend → Render static site (this file)
#
# The static site is built with Vite and talks to the backend at VITE_API_URL
# below. Deploy: Render dashboard ▸ New ▸ Blueprint ▸ pick
# selhadi88/CurriculumGPT. Full walkthrough in DEPLOY.md.

services:
  - type: web
    name: curriculumgpt-frontend
    runtime: static
    buildCommand: >-
      cd frontend &&
      corepack enable &&
      pnpm install --no-frozen-lockfile &&
      pnpm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://selhadi-curriculumgpt-backend.hf.space
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
