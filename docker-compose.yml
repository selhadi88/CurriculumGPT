services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gurriculum
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gurriculum_db
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gurriculum -d gurriculum_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "7000:7000"
    environment:
      DATABASE_URL: postgresql+psycopg2://gurriculum:password@db:5432/gurriculum_db
      # Switch to curriculum_gpt to serve the 7-component model in the UI.
      MODEL_TYPE: ${MODEL_TYPE:-bge}
      MODEL_CHECKPOINT: ${MODEL_CHECKPOINT:-}
      MODEL_CACHE_DIR: /model_cache
      # Container is CPU-only by default (base image has CPU torch). The GPU
      # override file sets this to cuda. Do NOT inherit host DEVICE=cuda here.
      DEVICE: cpu
      SEED_LIMIT: ${SEED_LIMIT:-2000}
      ONET_API_KEY: ${ONET_API_KEY:-}
      USAJOBS_API_KEY: ${USAJOBS_API_KEY:-}
      USAJOBS_EMAIL: ${USAJOBS_EMAIL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      CORS_ORIGINS_RAW: http://localhost:5173,http://localhost:3000
      LOG_LEVEL: INFO
    volumes:
      - model_cache:/model_cache
      - ./checkpoints:/app/checkpoints:ro
      - ./outputs:/app/outputs
      - ./data:/app/data
      # Mount source code so edits apply on `docker compose restart backend`
      # (no image rebuild needed). This sidesteps Docker build-cache staleness.
      - ./backend:/app/backend
      - ./ml:/app/ml
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:7000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  model_cache:
